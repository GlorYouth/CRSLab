# dataset
dataset: ReDial
tokenize: nltk
embedding: word2vec.npy
# dataloader
context_truncate: 256
response_truncate: 30
scale: 1
# model
model: KGSF
token_emb_dim: 300
kg_emb_dim: 256
num_bases: 4
n_heads: 2
n_layers: 2
ffn_size: 300
dropout: 0.1
attention_dropout: 0.0
relu_dropout: 0.1
learn_positional_embeddings: false
embeddings_scale: true
reduction: false
n_positions: 1024
# optim
pretrain:
  epoch: 3
  batch_size: 64
  optimizer:
    name: CAME
    lr: !!float 2e-4
    weight_decay: !!float 1e-2
    betas: [0.9, 0.999, 0.9999]
    eps: [1.0e-30, 1.0e-16]
rec:
  epoch: 9
  batch_size: 32
  optimizer:
    name: CAME
    lr: !!float 5e-5
    weight_decay: !!float 1e-2 #下一步增大
    betas: [0.93, 0.9995, 0.9999]
    eps: [1.0e-30, 1.0e-16]
conv:
  epoch: 9
  batch_size: 64
  optimizer:
    name: CAME
    lr: !!float 5e-5
    weight_decay: !!float 1e-2
    betas: [ 0.9, 0.999, 0.9999 ]
    eps: [ 1.0e-30, 1.0e-16 ]
  lr_scheduler:
    name: ReduceLROnPlateau
    patience: 3
    factor: 0.5
  gradient_clip: 0.3
